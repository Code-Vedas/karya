<%
backend = ENV.fetch('KARYA_FRAMEWORK_E2E_BACKEND', 'sqlite')
default_database_url = "sqlite3://#{Rails.root.join('storage/test.sqlite3')}"
database_url = ENV['KARYA_FRAMEWORK_E2E_DATABASE_URL'] || default_database_url
namespace = ENV.fetch('KARYA_FRAMEWORK_E2E_NAMESPACE', 'karya-rails-dummy')
%>
defaults:
  backend: <%= backend %>
<% if backend == 'in_memory' %>
  backend_config: {}
<% else %>
  backend_config:
    url: <%= database_url %>
    namespace: <%= namespace %>
<% end %>
  job_paths:
    - app/jobs
  boot_files: []

development: {}
test: {}
production: {}

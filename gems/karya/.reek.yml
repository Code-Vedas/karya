---
detectors:
  UncommunicativeVariableName:
    accept:
      - e
      - t
      - _
  TooManyStatements:
    enabled: true
    max_statements: 25
    exclude:
      - Karya::QueueStore::Internal::StoreState#initialize
  TooManyMethods:
    enabled: true
    max_methods: 30
    exclude:
      - Karya::Kaal::Store
      - Karya::Internal::DurableQueueStore::SqlStateStore
      - Karya::Job
  BooleanParameter:
    enabled: false
  ControlParameter:
    enabled: false
  TooManyConstants:
    enabled: true
    max_constants: 30
  LongParameterList:
    enabled: true
    max_params: 10
    exclude:
      - Karya::Worker::Configuration#initialize
      - Karya::FrameworkJob::Discovery#initialize
      - Karya::Internal::FrameworkWorkflow::StepBinding#initialize
  TooManyInstanceVariables:
    enabled: true
    max_instance_variables: 10
    exclude:
      - Karya::QueueStore::Internal::StoreState
      - Karya::WorkerSupervisor::Configuration
  DataClump:
    enabled: false
  FeatureEnvy:
    enabled: true
    exclude:

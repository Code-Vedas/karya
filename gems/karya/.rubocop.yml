plugins:
  - rubocop-factory_bot
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec
  - rubocop-sequel

AllCops:
  NewCops: enable
  SuggestExtensions: true
  TargetRubyVersion: 3.2
  Exclude:
    - .vscode/**/*
    - vendor/**/*
    - vendor/bundle/**/*

Layout/LineLength:
  Max: 160

Metrics/BlockLength:
  Max: 50

Metrics/MethodLength:
  Max: 60

Metrics/ModuleLength:
  Max: 300

Metrics/ParameterLists:
  Max: 10

Metrics/ClassLength:
  Max: 300
  Exclude:
    - lib/karya/kaal.rb

Metrics/AbcSize:
  Max: 30
  Exclude:
    - spec/karya/internal/durable_queue_store/operations_spec.rb
    - spec/karya/queue_store/sq_lite_spec.rb

Metrics/CyclomaticComplexity:
  Max: 15

Metrics/PerceivedComplexity:
  Max: 15

RSpec/MultipleExpectations:
  Max: 30
  Exclude:
    - spec/karya/internal/durable_queue_store/operations_spec.rb

RSpec/ExampleLength:
  Max: 75
  Exclude:
    - spec/karya/internal/durable_queue_store/operations_spec.rb

RSpec/MultipleMemoizedHelpers:
  Max: 15

RSpec/NestedGroups:
  Max: 5

Style/Documentation:
  Enabled: false

Naming/VariableNumber:
  Exclude:
    - spec/karya/internal/durable_queue_store/operations_spec.rb
